{{ define "main" }}

<div class="container col-xxl-12">
  <h1 class="montserrat-header-text-1">{{ .Title }}</h1>                            <!-- Comment: The Page Header -->
  <div style="margin-top: 30px;"></div>                                             <!-- Comment: Space between Title and actual content"-->

  <div class="row">                                                                 <!-- Comment: Start of the Content-->
    <div class="nunito-text col-md-6 py-xxl-5">                                     <!-- Comment: The belief content -->
      {{ .Content }}
    </div>
    <div class="col-md-6 py-xxl-5">                                                 <!-- Comment: The picture beside the word -->
      {{ with .Resources.Get "card-1-english-service.jpg"}}
        <img src="{{ .RelPermalink }}" class="img-fluid mx-auto d-block" alt="">
      {{ end }}
    </div>  
    <div style="margin-top: 30px;"></div>                                           <!-- Comment: Space at the bottom -->
  </div>
</div>

{{ partial "cta-join-us.html" . }}

{{ partial "cta-activities.html" . }}

{{ end }}
