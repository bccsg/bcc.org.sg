{{ with .Site.Params.cta_activities }}
{{ "" | safeHTML }}

{{/* Define the image path as a variable to prevent editor linter errors */}}
{{ $bgImage := "images/bg-banner-newtobethany.png" | absURL }}

<div class="container-fluid px-0">
  <div class="px-4 py-5 mb-5 text-center" 
       style="background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('{{ $bgImage | safeCSS }}'); background-size: cover; background-position: center; background-repeat: no-repeat;">
    
    <h4 class="display-6 text-center text-white">{{ .title }}</h4>
    <div class="col-lg-6 mx-auto">
      <p class="nunito-text my-4 mx-auto text-center text-white" style="max-width: 300px">{{ .description }}</p>
    </div>
    <div class="nunito-text gap-2 d-flex justify-content-center">
      <a href="{{ .buttonUrl | absURL }}" class="btn btn-light btn-lg px-4">{{ .buttonText }}</a>
    </div>
  </div>
</div>
{{ "" | safeHTML }}
{{ end }}
